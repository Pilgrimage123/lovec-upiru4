<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 800" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="vn-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04060c"/>
      <stop offset="45%" stop-color="#0b1224"/>
      <stop offset="80%" stop-color="#141a2e"/>
      <stop offset="100%" stop-color="#111018"/>
    </linearGradient>
    <radialGradient id="vn-moon-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffce8" stop-opacity="1"/>
      <stop offset="25%" stop-color="#e2e8f0" stop-opacity="0.8"/>
      <stop offset="60%" stop-color="#94a3b8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#141a2e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vn-fog" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#090604" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="vn-window-light" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Sky -->
  <rect width="1920" height="800" fill="url(#vn-sky)"/>

  <!-- Distant Stars -->
  <g fill="#ffffff" opacity="0.6">
    <circle cx="120" cy="80" r="1.5"/>
    <circle cx="280" cy="140" r="1.2"/>
    <circle cx="450" cy="60" r="1.8"/>
    <circle cx="620" cy="110" r="1"/>
    <circle cx="790" cy="70" r="1.5"/>
    <circle cx="1120" cy="90" r="1.4"/>
    <circle cx="1320" cy="50" r="1.7"/>
    <circle cx="1490" cy="130" r="1.1"/>
    <circle cx="1680" cy="75" r="1.6"/>
    <circle cx="1820" cy="120" r="1.3"/>
  </g>

  <!-- Full Moon with Eerie Glow -->
  <circle cx="960" cy="180" r="120" fill="url(#vn-moon-glow)"/>
  <circle cx="960" cy="180" r="42" fill="#fffef0"/>
  <!-- Moon Craters -->
  <circle cx="945" cy="170" r="8" fill="#e2e8f0" opacity="0.6"/>
  <circle cx="972" cy="192" r="11" fill="#cbd5e1" opacity="0.5"/>
  <circle cx="952" cy="198" r="6" fill="#cbd5e1" opacity="0.4"/>

  <!-- Mountain/Forest Silhouette in Distance -->
  <path d="M0 480 Q240 430 520 460 T1100 440 T1600 470 T1920 450 L1920 800 L0 800 Z" fill="#080c14" opacity="0.8"/>

  <!-- Village Roofs and Church Spire -->
  <g fill="#07090e">
    <!-- Church Spire -->
    <path d="M720 460 L750 260 L780 460 Z"/>
    <line x1="750" y1="235" x2="750" y2="260" stroke="#07090e" stroke-width="4"/>
    <line x1="742" y1="245" x2="758" y2="245" stroke="#07090e" stroke-width="3"/>
    <rect x="710" y="450" width="80" height="90"/>

    <!-- Left Houses -->
    <polygon points="120,490 220,380 320,490"/>
    <rect x="140" y="490" width="160" height="90"/>
    <polygon points="300,510 410,410 520,510"/>
    <rect x="330" y="510" width="160" height="80"/>

    <!-- Spooky Windmill Silhouette on hill -->
    <polygon points="1520,470 1550,330 1580,470"/>
    <line x1="1550" y1="330" x2="1610" y2="270" stroke="#07090e" stroke-width="4"/>
    <line x1="1550" y1="330" x2="1490" y2="390" stroke="#07090e" stroke-width="4"/>
    <line x1="1550" y1="330" x2="1610" y2="390" stroke="#07090e" stroke-width="4"/>
    <line x1="1550" y1="330" x2="1490" y2="270" stroke="#07090e" stroke-width="4"/>

    <!-- Right Houses -->
    <polygon points="1660,500 1760,400 1860,500"/>
    <rect x="1690" y="500" width="150" height="90"/>
  </g>

  <!-- Warm Lantern Lights in Cottage Windows -->
  <circle cx="220" cy="530" r="32" fill="url(#vn-window-light)"/>
  <rect x="212" y="522" width="16" height="16" rx="2" fill="#fef08a"/>
  <circle cx="410" cy="540" r="28" fill="url(#vn-window-light)"/>
  <rect x="404" y="534" width="12" height="12" rx="2" fill="#fef08a"/>

  <!-- Gnarled Bare Trees on flanks -->
  <g stroke="#08080c" stroke-linecap="round" fill="none">
    <!-- Left tree -->
    <path d="M80 620 Q95 480 70 380 Q100 320 85 270" stroke-width="14"/>
    <path d="M75 420 Q120 370 140 330" stroke-width="7"/>
    <path d="M120 370 Q160 360 175 325" stroke-width="4"/>
    <path d="M70 380 Q40 340 30 290" stroke-width="6"/>
    <!-- Right tree -->
    <path d="M1840 620 Q1820 470 1850 370 Q1830 310 1845 250" stroke-width="14"/>
    <path d="M1835 430 Q1790 380 1765 340" stroke-width="7"/>
    <path d="M1850 370 Q1885 330 1895 280" stroke-width="6"/>
  </g>

  <!-- Old Wooden Picket Fence Silhouette -->
  <g fill="#0c0d12">
    <rect x="30" y="550" width="8" height="70"/>
    <rect x="60" y="555" width="8" height="65"/>
    <rect x="90" y="548" width="8" height="72"/>
    <rect x="120" y="552" width="8" height="68"/>
    <rect x="20" y="580" width="120" height="6"/>
    <rect x="1800" y="552" width="8" height="68"/>
    <rect x="1830" y="546" width="8" height="74"/>
    <rect x="1860" y="554" width="8" height="66"/>
    <rect x="1890" y="550" width="8" height="70"/>
    <rect x="1790" y="580" width="120" height="6"/>
  </g>

  <!-- Ground Fog / Mist Transition -->
  <rect y="440" width="1920" height="360" fill="url(#vn-fog)"/>
</svg>
